version: 2

models:
  - name: int_order_items_calculated
    description: "Calcul des montants bruts, remises et nets par ligne de commande."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: net_amount
        tests: [not_null]

  - name: int_orders_enriched
    description: "Commandes enrichies avec les totaux calculés."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: staff_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_staffs')
                field: staff_id
      - name: order_total
        tests: [not_null]