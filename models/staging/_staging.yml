version: 2

models:
  - name: stg_brands
    description: "Nettoyage des marques."
    columns:
      - name: brand_id
        tests: [not_null, unique]
      - name: brand_name
        tests: [not_null]

  - name: stg_categories
    description: "Nettoyage des catégories."
    columns:
      - name: category_id
        tests: [not_null, unique]
      - name: category_name
        tests: [not_null]

  - name: stg_customers
    description: "Nettoyage des clients."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: first_name
        tests: [not_null]
      - name: last_name
        tests: [not_null]
      - name: email
        tests: [not_null]

  - name: stg_order_items
    description: "Lignes de commande nettoyées."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        tests: [not_null]
      - name: list_price
        tests: [not_null]

  - name: stg_orders
    description: "Commandes nettoyées."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: staff_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_staffs')
                field: staff_id
      - name: order_date
        tests: [not_null]

  - name: stg_products
    description: "Produits nettoyés."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: brand_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_brands')
                field: brand_id
      - name: category_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_categories')
                field: category_id
      - name: product_name
        tests: [not_null]
      - name: list_price
        tests: [not_null]

  - name: stg_staffs
    description: "Employés nettoyés."
    columns:
      - name: staff_id
        tests: [not_null, unique]
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: email
        tests: [not_null]

  - name: stg_stocks
    description: "Stocks par magasin et produit."
    columns:
      - name: stock_key
        tests: [not_null, unique]
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_stores
    description: "Magasins nettoyés."
    columns:
      - name: store_id
        tests: [not_null, unique]
      - name: store_name
        tests: [not_null]
      - name: email
        tests: [not_null]